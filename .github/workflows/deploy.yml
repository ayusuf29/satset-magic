name: Deploy Satset Magic to GCP VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Cloud VM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "🚀 [CI/CD] Starting automated deployment on GCP VM..."
            
            # Navigasi ke direktori project
            cd ~/satset-magic
            
            # Tarik kode terbaru dari branch main
            echo "📥 [CI/CD] Fetching latest changes from Git..."
            git fetch origin main
            git reset --hard origin/main
            
            # Rebuild dan deploy kontainer Docker
            echo "🐳 [CI/CD] Building and restarting containers..."
            docker compose up -d --build orchestrator dashboard
            
            # Bersihkan unused images untuk menghemat disk
            echo "🧹 [CI/CD] Pruning dangling Docker images..."
            docker image prune -f
            
            # Verifikasi kesehatan kontainer
            echo "🩺 [CI/CD] Verifying running containers..."
            docker compose ps
            
            echo "✅ [CI/CD] Deployment successfully completed!"
